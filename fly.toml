# Fly.io config for the (T)ExMex demo.
#
# The orders, the kitchen, and Presence live in memory on one node, so the app runs on
# exactly one machine that never stops. Deploy with `fly deploy --ha=false`.

app = 'texmex'
primary_region = 'dfw'
kill_signal = 'SIGTERM'

[build]

[env]
  PHX_HOST = 'texmex.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
